name: Publish course image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release label; must match VERSION (for example 2026.1-l01-rc2)
        required: true
        default: 2026.1-l01-rc2

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-l01-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/shad-ros2/tasks

jobs:
  build-publish-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate release label
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]{4}\.[0-9]+-l[0-9]{2}([.-][a-z0-9]+)*$ ]] || {
            echo "Unsupported release label: $RELEASE_TAG" >&2
            exit 2
          }
          EXPECTED_RELEASE="$(tr -d '\r\n' < VERSION)"
          [[ "$RELEASE_TAG" == "$EXPECTED_RELEASE" ]] || {
            echo "release_tag must match VERSION ($EXPECTED_RELEASE)" >&2
            exit 2
          }

      - name: Enable cross-platform builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          IMAGE_REF="${IMAGE_NAME}:${RELEASE_TAG}"
          set +e
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "$IMAGE_REF" 2>&1)"
          INSPECT_STATUS=$?
          set -e
          if [[ "$INSPECT_STATUS" -eq 0 ]]; then
            echo "Refusing to overwrite published tag: $IMAGE_REF" >&2
            exit 2
          fi
          if ! grep -Eiq 'not found|manifest unknown|name unknown' <<< "$INSPECT_OUTPUT"; then
            echo "$INSPECT_OUTPUT" >&2
            echo "Could not prove that $IMAGE_REF is unused" >&2
            exit 2
          fi

      - name: Build and publish linux/amd64 + linux/arm64
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.release_tag }}
          build-args: |
            COURSE_RELEASE=${{ inputs.release_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=SHAD ROS 2 course environment for Lesson 01
            org.opencontainers.image.licenses=MIT

      - name: Verify manifest and smoke exact digest on native amd64
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$IMAGE_REF"
          docker buildx imagetools inspect --raw "$IMAGE_REF" | python3 -c '
          import json, sys
          manifest = json.load(sys.stdin)
          platforms = {(item["platform"]["os"], item["platform"]["architecture"]) for item in manifest.get("manifests", [])}
          required = {("linux", "amd64"), ("linux", "arm64")}
          assert required <= platforms, f"missing platforms: {required - platforms}"
          '
          {
            echo "COURSE_IMAGE=$IMAGE_REF"
            echo "IDE_PORT=8080"
            echo "SIM_PORT=8081"
            echo "LOCAL_UID=$(id -u)"
            echo "LOCAL_GID=$(id -g)"
          } > .env
          docker pull "$IMAGE_REF"
          docker compose up -d --wait
          ./course doctor
          ./course build
          python3 -m json.tool reports/environment.json
          {
            echo "## Published Day 1 image"
            echo
            echo "\`$IMAGE_REF\`"
            echo
            echo "Native amd64 Compose, doctor, and starter build passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up smoke environment
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
          rm -f .env
