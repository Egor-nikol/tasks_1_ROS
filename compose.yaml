services:
  workspace:
    # Instructor freeze_release.py replaces .env with an immutable manifest digest.
    image: ${COURSE_IMAGE:-sda-ros2-l01:2026.1-l01-rc2}
    pull_policy: missing
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /tmp/course-home
      COURSE_WORKSPACE: /workspace
      COURSE_IMAGE_REF: ${COURSE_IMAGE:-sda-ros2-l01:2026.1-l01-rc2}
      ROS_DOMAIN_ID: '42'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:${IDE_PORT:-8080}:8080"
      - "127.0.0.1:${SIM_PORT:-8081}:8081"
    shm_size: 256m
    mem_limit: 4g
    # GitHub's standard Linux runner exposes 2 CPUs; allow staff to raise this
    # locally without making the portable release gate impossible to start.
    cpus: "${COURSE_CPUS:-2}"
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [course, dev]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 6
